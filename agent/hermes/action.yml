name: Hermes
description: Run a one-shot Hermes agent prompt against OpenRouter
inputs:
  prompt:
    description: Prompt to send to Hermes
    required: true
  openrouter-api-key:
    description: OpenRouter API key (pass from a secret, e.g. secrets.OPENROUTER_API_KEY)
    required: true
  model:
    description: OpenRouter model id, e.g. anthropic/claude-haiku-5.5
    default: anthropic/claude-haiku-5.5
  reasoning-effort:
    description: Thinking level passed as --reasoning (none, minimal, low, medium, high, xhigh, max, ultra)
    default: high
  max-turns:
    description: Maximum tool-calling iterations for the run
    default: "100"
  pr-number:
    description: PR number to post the Hermes output to as a comment (empty skips posting)
    default: ""
  yolo:
    description: Skip Hermes approval prompts for dangerous commands (true/false). Required for unattended tool use.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Hermes
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run Hermes
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        MODEL: ${{ inputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        MAX_TURNS: ${{ inputs.max-turns }}
        YOLO: ${{ inputs.yolo }}
      run: |
        set -euo pipefail
        if [ -z "$PROMPT" ]; then echo "prompt input is empty" >&2; exit 1; fi
        if ! command -v hermes >/dev/null; then echo "hermes not found on PATH" >&2; exit 1; fi

        prompt_file="${RUNNER_TEMP}/hermes-prompt.txt"
        output_file="${RUNNER_TEMP}/hermes-output.txt"
        printf '%s' "$PROMPT" > "$prompt_file"

        # --query-file avoids shell quoting issues with the prompt text.
        args=(chat --oneshot --quiet --provider openrouter --model "$MODEL"
              --max-turns "$MAX_TURNS" --reasoning "$REASONING_EFFORT"
              --query-file "$prompt_file")
        if [ "$YOLO" = "true" ]; then args+=(--yolo); fi

        raw_file="${RUNNER_TEMP}/hermes-raw.txt"
        hermes "${args[@]}" | tee "$raw_file"

        # Quiet mode appends session info to the response; keep it out of the PR comment.
        grep -v '^session_id: ' "$raw_file" > "$output_file" || true

        # The runner is fresh, so a one-day window covers just this run.
        stats_file="${RUNNER_TEMP}/hermes-stats.txt"
        hermes insights --days 1 > "$stats_file" 2>&1 || true

        {
          echo "## Hermes output"
          echo
          cat "$output_file"
          echo
          echo "## Hermes usage"
          echo
          echo '```'
          cat "$stats_file"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::group::Hermes usage"; cat "$stats_file"; echo "::endgroup::"

    - name: Post output to PR
      if: inputs.pr-number != ''
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        MODEL: ${{ inputs.model }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        output_file="${RUNNER_TEMP}/hermes-output.txt"
        body_file="${RUNNER_TEMP}/hermes-comment.md"
        marker='<!-- hermes-review -->'

        # The checkout is the PR head; github.sha would be the default branch for comment triggers.
        sha=$(git rev-parse --short HEAD 2>/dev/null || echo "${GITHUB_SHA::7}")

        # GitHub rejects comments over 65536 characters; keep headroom.
        max_bytes=60000
        {
          echo "$marker"
          echo "<sub>Hermes review of \`$sha\` · \`$MODEL\` · [run]($RUN_URL)</sub>"
          echo
          head -c "$max_bytes" "$output_file"
          if [ "$(wc -c < "$output_file")" -gt "$max_bytes" ]; then
            echo
            echo "_Output truncated. See the job summary or logs for the full run._"
          fi
        } > "$body_file"

        # Update the previous Hermes comment in place instead of stacking a new one per run.
        existing=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n1)
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@"$body_file" >/dev/null
        else
          gh pr comment "$PR_NUMBER" --body-file "$body_file"
        fi
