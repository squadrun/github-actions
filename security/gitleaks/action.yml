name: Gitleaks
description: Scan the repository for secrets using the gitleaks CLI
inputs:
  version:
    description: gitleaks version to install (without the leading v)
    default: "8.30.1"
  config:
    description: Path to a gitleaks config file (uses gitleaks defaults if empty)
    default: ""
  args:
    description: Extra arguments passed to `gitleaks git`
    default: ""
runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target=linux_x64 ;;
          Linux-ARM64) target=linux_arm64 ;;
          macOS-X64) target=darwin_x64 ;;
          macOS-ARM64) target=darwin_arm64 ;;
          *) echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
        tarball="gitleaks_${VERSION}_${target}.tar.gz"
        dir="${RUNNER_TEMP}/gitleaks"
        mkdir -p "$dir"
        curl -fsSL -o "${dir}/${tarball}" "${base}/${tarball}"
        curl -fsSL -o "${dir}/checksums.txt" "${base}/gitleaks_${VERSION}_checksums.txt"
        (cd "$dir" && grep " ${tarball}\$" checksums.txt | shasum -a 256 -c -)
        tar -xzf "${dir}/${tarball}" -C "$dir" gitleaks
        echo "$dir" >> "$GITHUB_PATH"

    - name: Run gitleaks
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        args=(git --redact --verbose --exit-code 1)
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
        # shellcheck disable=SC2086
        gitleaks "${args[@]}" $EXTRA_ARGS .
